# 벤치 구성 — 모터 두 대짜리 왼다리. **robot_v1.0.yaml 의 벤치판임.**
#
# 실물은 knee(RS04, id 4)와 ankle_a(RS03, id 5) 둘뿐이고 나머지 넷은 아직 없음.
# 그래도 여섯을 다 적는 이유: `robots/leg.py` 의 REQUIRED_MOTORS 가 여섯을 요구함.
# 빠뜨리면 "다리에 필요한 모터가 없음" 으로 조립 자체가 안 됨. 없는 넷은 응답이
# 없을 뿐이고, 그 사실은 텔레메트리의 ack/miss 에 그대로 드러남 -- 숨기지 않음.
#
# v1.0 과 다른 곳은 네 군데뿐임. 그 외 값(모터 id·모델·게인)은 v1.0 그대로라
# 벤치에서 맞춘 것이 실물에 그대로 올라감.
#
#   1. left_leg 만 있음        양다리 설정이면 build_biped 가 없는 다리까지 세움
#   2. channel/interface       벤치는 CANable(slcan)을 slcand 로 can0 에 올려 씀
#   3. link_loss_cycles: 0     없는 모터 넷이 매 주기 응답을 빠뜨림. 5 로 두면
#                              통신 끊김으로 판정해 곧바로 로봇을 세움 (control/loop.py)
#   4. enforce_limits: false   calibration/left_leg_v1.0.json 이 아직 실측 전이라
#                              limits_deg 가 전부 null 임. 커미셔닝(sweep+zero)을
#                              마치면 이 줄을 지우고 v1.0 과 같은 true 로 돌릴 것
#
# 각도는 전부 cal 공간임 -- 관절 각도이지 모터가 보고하는 raw 값이 아님.
name: huphy_bench
safety:
  command_margin_deg: 3.0
  # 이 값 x control_hz 가 실질 속도 상한임 (guards.clamp_jump 주석: "클리핑 = 속도 제한이다").
  # 50.0 은 100 Hz 에서 초당 5000도 = 초당 13.9바퀴로, RS04 무부하 최고속도(초당 약 1140도)의
  # 4.4배라 한 번도 걸리지 않음 -- 즉 속도 제한이 없는 것과 같았음. 2026-09-05 실측:
  # 25도 점프에 무릎 초당 336도(kp 30). 게인을 학습값(220)으로 올리면 훨씬 더 빨라짐.
  # 3.0 x 100 Hz = 초당 300도. 사람 무릎이 걸을 때 내는 최대치(초당 약 400도)보다 낮고,
  # 벤치에서 재 본 실제 추종 속도(초당 74도)보다는 충분히 높음.
  max_delta_deg: 3.0
  enforce_limits: false     # 커미셔닝 전용. 실측 끝나면 true 로
  link_loss_cycles: 0       # 없는 모터 넷 때문에 켜 두면 즉시 정지함
telemetry:
  host: 192.168.20.177      # pygviewer 브리지가 받는 주소
  port: 9870
  csv_path: null
  csv_flush_every: 50
imus:
  # 2026-09-06: 벤치에 EBIMU 한 개 물림. 읽기만 해서 확인한 값 (huphy-imu apply 안 돌림 --
  # apply 는 센서 비휘발성 메모리를 바꾸고 전원을 껐다 켜도 남음):
  #
  #   초당 100줄, 줄당 15개 항목  = quat 4 + gyro 3 + accel 3 + dist 3 + temp 1 + time 1
  #   사원수 크기 1.000        -> 자세 정상
  #   가속도 크기 1.001 g      -> 중력 포함이 맞음 (accel_mode: gravity)
  #   가만히 둔 상태 각속도 0.00 -> 영점 정상
  #
  # 즉 센서가 이미 아래 output 그대로 보내고 있어 apply 가 필요 없음.
  main:
    model: ebimu
    # udev 심볼릭 링크(/dev/ebimu)는 이 컴퓨터에 아직 없음. by-id 경로는 USB 포트를 바꿔
    # 꽂아도 같은 이름이라 ttyUSB 번호보다 안전함 -- ttyUSB 번호는 꽂는 순서대로 붙음.
    port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    # 다리가 아직 없어 책상에 놓여 있음. 다리에 붙이면 이 한 줄만 바꾸면 됨.
    mount: left_leg
    output: [quat, gyro, accel, dist, temp, time]
    accel_mode: gravity
    dist_mode: local
    rate_hz: 100
limbs:
  left_leg:
    kind: leg
    side: left
    channel: can0           # sudo slcand -o -c -s8 /dev/ttyACM0 can0 && sudo ip link set can0 up
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/left_leg_v1.0.json
    motors:
      hip_pitch: {id: 1,  model: RS04, kp: 10.0, kd: 1.0}   # 없음
      hip_roll:  {id: 2,  model: RS04, kp: 10.0, kd: 1.0}   # 없음
      hip_yaw:   {id: 3,  model: RS03, kp: 10.0, kd: 1.0}   # 없음
      knee:      {id: 4,  model: RS04, kp: 10.0, kd: 1.0}   # 실물 (2026-09-04 육안 확인)
      ankle_a:   {id: 5,  model: RS03, kp: 10.0, kd: 1.0}   # 실물 (2026-09-04 육안 확인)
      ankle_b:   {id: 6,  model: RS03, kp: 10.0, kd: 1.0}   # 없음
