# 로봇 구성 — 사람이 적는 것.  ** HUPHY 0.5 **
#
# 다리 하나. 고관절·무릎이 RS02, 발목이 RS00.
# 1.0 은 robot_v1.0.yaml 에 있음. 지금 쓰는 쪽은 robot.yaml 심볼릭 링크가 가리킴.
#
# 여기 있는 값은 배선과 튜닝에서 옴. 로봇을 만져서 알아내는 값(sign, offset_deg,
# zero_reference, limits_deg)은 calibration/*.json 에 있음.
#
# 가르는 기준은 "이 숫자를 어디서 얻었나" 임. 모터를 갈면 다시 재야 하는 값과
# 그대로인 값이 갈리는데, 한 파일에 두면 캘리브레이션 절차가 파일을 새로 쓸 때
# 안 바뀌어야 할 값까지 같이 날아감.
#
# limits_deg 를 여기 적으면 거부함. 같은 값이 두 군데 생기면 어긋났을 때 어느
# 쪽이 진짜인지 알 수 없음 (이슈 #2).
#
# 벤더 사양(인코딩 범위, 명령 바이트)은 src/huphy/motors/robstride/tables.py 에 있음.
#
# 각도는 전부 cal 공간임 -- 관절 각도이지 모터가 보고하는 raw 값이 아님.
# src/huphy/motors/README.md 의 "raw 와 cal" 참조.

name: huphy

safety:
  command_margin_deg: 3.0   # 한계에서 이만큼 안쪽까지만 명령함
  max_delta_deg: 50.0       # 한 주기에 움직일 수 있는 최대 각도
  enforce_limits: true      # false 는 커미셔닝 전용

  # 이 주기 수만큼 연속으로 응답이 없으면 로봇을 세움 (100Hz 에서 50ms).
  # 한 주기 빠지는 것은 흔하고 다음 주기에 옴. 이어지면 그 모터는 현재 위치를
  # 모른 채 마지막 명령을 유지하고 있음 -- 양다리에서는 한쪽만 움직여 넘어짐.
  # 0 이면 판정하지 않음 (커미셔닝용).
  link_loss_cycles: 5

telemetry:
  host: 192.168.0.15                # 비우면 UDP 송신 안 함
  port: 9870
  csv_path: null
  csv_flush_every: 50

imus:
  # 개체 이름이 키이고, 그 이름이 텔레메트리 필드 앞에 붙음 (imu/main/roll).
  # mount 는 어디 붙었는지임 -- 다리에서 몸통으로 옮기면 이 한 줄만 바뀜.
  # port 는 udev 로 고정한 심볼릭 링크를 쓸 것. USB 는 순서대로 번호가 붙음.
  main:
    model: ebimu
    port: /dev/ebimu
    mount: right_leg

    # 센서가 보내는 항목. 순서가 곧 패킷 안의 순서임.
    # EBIMU 패킷에는 무엇이 켜져 있는지가 안 적혀 있어서 여기 적어 둬야 함.
    # 센서를 이 목록에 맞추는 것은 huphy-imu apply 가 함.
    output: [quat, gyro, accel, dist, temp, time]

    # accel/dist 는 값에 따라 뜻이 달라지는데 필드 수가 같아 패킷으로 구분이 안 됨.
    # gravity 는 중력 포함 -- huphy-imu check 가 이것에 기댐.
    accel_mode: gravity
    dist_mode: local

    rate_hz: 100

    # baudrate 를 안 적으면 센서 출하 기본값을 씀 (EBIMU 115200).
    # 15필드 100Hz 면 약 11 KB/s 라 115200 이 거의 꽉 참. 항목을 더 켤 거면
    # <sb6> 으로 230400 으로 올리고 이 줄을 같이 고칠 것.
    # baudrate: 230400

limbs:
  # 개체 이름이 키임. kind 는 어떤 기구학을 쓰는지, side 는 거울상인지를 말함.
  # 셋을 한 필드가 겸하면 팔이나 허리가 붙을 때 막힘 (이슈 #5).
  right_leg:
    kind: leg
    side: right
    channel: can1
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/right_leg_v0.5.json

    # 한계각은 여기 없음. calibration/right_leg_v0.5.json 의 limits_deg 임 --
    # commission sweep 이 재서 적음.
    #
    # kp/kd 는 아직 실물에서 튜닝하기 전의 시작값임. 여기서부터 올리거나 내림.
    # 처음 만질 때는 huphy-bringup --gain-scale 0.1 로 더 낮춰 시작할 것 (이슈 #9).
    motors:
      hip_pitch: {id: 7,  model: RS02, kp: 20.0, kd: 1.0}
      hip_roll:  {id: 8,  model: RS02, kp: 20.0, kd: 1.0}
      hip_yaw:   {id: 9,  model: RS02, kp: 20.0, kd: 1.0}
      knee:      {id: 10, model: RS02, kp: 20.0, kd: 1.0}
      ankle_a:   {id: 11, model: RS00, kp: 20.0, kd: 1.0}
      ankle_b:   {id: 12, model: RS00, kp: 20.0, kd: 1.0}

  left_leg:
    kind: leg
    side: left
    channel: can0
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/left_leg_v0.5.json

    # 아직 연결되지 않았고 한계도 재기 전임 (calibration/left_leg_v0.5.json 의
    # limits_deg 가 전부 null). 값이 없는 것과 "제한 없음" 은 다름 -- null 이면
    # Motor.is_configured 가 False 가 되어 제어 진입이 막힘.
    #
    # kp/kd 도 비워 둠. 한계를 모르는 관절에 게인만 넣으면 어디까지 가도 되는지
    # 모르는 채로 토크가 나감.
    motors:
      hip_pitch: {id: 1,  model: RS02}
      hip_roll:  {id: 2,  model: RS02}
      hip_yaw:   {id: 3,  model: RS02}
      knee:      {id: 4,  model: RS02}
      ankle_a:   {id: 5,  model: RS00}
      ankle_b:   {id: 6,  model: RS00}
