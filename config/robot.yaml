# 로봇 구성 — 사람이 적는 것.
#
# 여기 있는 값은 배선과 튜닝에서 옴. 로봇을 만져서 알아내는 값(sign, offset_deg,
# zero_reference, limits_deg)은 calibration/*.json 에 있음.
#
# 가르는 기준은 "이 숫자를 어디서 얻었나" 임. 모터를 갈면 다시 재야 하는 값과
# 그대로인 값이 갈리는데, 한 파일에 두면 캘리브레이션 절차가 파일을 새로 쓸 때
# 안 바뀌어야 할 값까지 같이 날아감.
#
# limits_deg 를 여기 적으면 거부함. 같은 값이 두 군데 생기면 어긋났을 때 어느
# 쪽이 진짜인지 알 수 없음 (이슈 #2).
#
# 벤더 사양(인코딩 범위, 명령 바이트)은 src/huphy/motors/robstride/tables.py 에 있음.
#
# 각도는 전부 cal 공간임 -- 관절 각도이지 모터가 보고하는 raw 값이 아님.
# src/huphy/motors/README.md 의 "raw 와 cal" 참조.

name: huphy

safety:
  command_margin_deg: 3.0   # 한계에서 이만큼 안쪽까지만 명령함
  max_delta_deg: 50.0       # 한 주기에 움직일 수 있는 최대 각도
  enforce_limits: true      # false 는 커미셔닝 전용

telemetry:
  host: 192.168.0.15                # 비우면 UDP 송신 안 함
  port: 9870
  csv_path: null
  csv_flush_every: 50

imus:
  # 개체 이름이 키이고, 그 이름이 텔레메트리 필드 앞에 붙음 (imu/main/roll).
  # mount 는 어디 붙었는지임 -- 다리에서 몸통으로 옮기면 이 한 줄만 바뀜.
  # port 는 udev 로 고정한 심볼릭 링크를 쓸 것. USB 는 순서대로 번호가 붙음.
  main:
    model: xsens_mti
    port: /dev/xsens_mti
    baudrate: 921600
    mount: right_leg

limbs:
  # 개체 이름이 키임. kind 는 어떤 기구학을 쓰는지, side 는 거울상인지를 말함.
  # 셋을 한 필드가 겸하면 팔이나 허리가 붙을 때 막힘 (이슈 #5).
  right_leg:
    kind: leg
    side: right
    channel: can1
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/right_leg.json

    # 한계각은 여기 없음. calibration/right_leg.json 의 limits_deg 임 --
    # commission sweep 이 재서 적음.
    #
    # kp/kd 는 아직 실물에서 튜닝하기 전의 시작값임. 여기서부터 올리거나 내림.
    # 처음 만질 때는 huphy-bringup --gain-scale 0.1 로 더 낮춰 시작할 것 (이슈 #9).
    motors:
      hipz:     {id: 7,  model: RS02, kp: 20.0, kd: 1.0}
      hipx:     {id: 8,  model: RS02, kp: 20.0, kd: 1.0}
      hipy:     {id: 9,  model: RS02, kp: 20.0, kd: 1.0}
      knee:     {id: 10, model: RS02, kp: 20.0, kd: 1.0}
      ankle_a1: {id: 11, model: RS00, kp: 20.0, kd: 1.0}
      ankle_a2: {id: 12, model: RS00, kp: 20.0, kd: 1.0}

  left_leg:
    kind: leg
    side: left
    channel: can0
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/left_leg.json

    # 아직 연결되지 않았고 한계도 재기 전임 (calibration/left_leg.json 의
    # limits_deg 가 전부 null). 값이 없는 것과 "제한 없음" 은 다름 -- null 이면
    # Motor.is_configured 가 False 가 되어 제어 진입이 막힘.
    #
    # kp/kd 도 비워 둠. 한계를 모르는 관절에 게인만 넣으면 어디까지 가도 되는지
    # 모르는 채로 토크가 나감.
    motors:
      hipz:     {id: 1, model: RS02}
      hipx:     {id: 2, model: RS02}
      hipy:     {id: 3, model: RS02}
      knee:     {id: 4, model: RS02}
      ankle_a1: {id: 5, model: RS00}
      ankle_a2: {id: 6, model: RS00}
