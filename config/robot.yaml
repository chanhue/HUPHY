# 로봇 구성 — 사람이 적는 것.
#
# 여기 있는 값은 배선·기구 설계·튜닝에서 옴. 조립을 재서 얻는 값(sign, offset_deg,
# zero_reference)은 calibration/*.json 에 있음. 프로그램이 쓰는 파일과 사람이 쓰는
# 파일을 나눈 것임 -- 이 파일은 주석이 많아서 프로그램이 다시 쓰면 날아감.
#
# commission sweep 은 limits_deg 를 화면에 내주기만 하고 여기 적지는 않음.
#
# 벤더 사양(인코딩 범위, 명령 바이트)은 src/huphy/motors/robstride/tables.py 에 있음.
#
# 각도는 전부 cal 공간임 -- 관절 각도이지 모터가 보고하는 raw 값이 아님.
# src/huphy/motors/README.md 의 "raw 와 cal" 참조.

name: huphy

safety:
  command_margin_deg: 3.0   # 한계에서 이만큼 안쪽까지만 명령함
  max_delta_deg: 50.0       # 한 주기에 움직일 수 있는 최대 각도
  enforce_limits: true      # false 는 커미셔닝 전용

telemetry:
  host: null                # 비우면 UDP 송신 안 함
  port: 9870
  csv_path: null
  csv_flush_every: 50

limbs:
  # 개체 이름이 키임. kind 는 어떤 기구학을 쓰는지, side 는 거울상인지를 말함.
  # 셋을 한 필드가 겸하면 팔이나 허리가 붙을 때 막힘 (이슈 #5).
  right_leg:
    kind: leg
    side: right
    channel: can1
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/right_leg.json

    # limits_deg 는 하드스톱 위치임. 여유를 뺀 값이 아니라 하드스톱 자체이고,
    # safety.command_margin_deg 를 여기서 빼서 명령 구간이 나옴.
    #
    # commission sweep 이 재서 내는 값임. 토크를 끄고 관절을 손으로 양쪽 끝까지
    # 밀며 기록함. 발목은 발을 잡고 움직이면 두 모터가 같이 따라오므로 한 번에
    # 둘 다 나옴.
    #
    # 관절 좌표계 값임 -- sweep 이 관절 0도를 먼저 정하고 그 기준으로 재기 때문에,
    # 기계 영점(commission zero)을 다시 잡으면 여기 값도 다시 재야 함 (이슈 #2).
    #
    # kp/kd 는 아직 실물에서 튜닝하기 전의 시작값임. 여기서부터 올리거나 내림.
    # 처음 만질 때는 huphy-bringup --gain-scale 0.1 로 더 낮춰 시작할 것 (이슈 #9).
    motors:
      hipz:     {id: 7,  model: RS02, limits_deg: [-117.07,  -21.07], kp: 20.0, kd: 1.0}
      hipx:     {id: 8,  model: RS02, limits_deg: [  -5.51,   79.64], kp: 20.0, kd: 1.0}
      hipy:     {id: 9,  model: RS02, limits_deg: [ -41.90,   31.09], kp: 20.0, kd: 1.0}
      knee:     {id: 10, model: RS02, limits_deg: [ -20.65,   74.79], kp: 20.0, kd: 1.0}
      ankle_a1: {id: 11, model: RS00, limits_deg: [ -79.77,   43.16], kp: 20.0, kd: 1.0}
      ankle_a2: {id: 12, model: RS00, limits_deg: [ -12.50,  126.66], kp: 20.0, kd: 1.0}

  left_leg:
    kind: leg
    side: left
    channel: can0
    interface: socketcan
    control_hz: 100.0
    calibration: calibration/left_leg.json

    # 아직 연결되지 않았고 한계도 재기 전임. limits_deg 를 비워 두면
    # Motor.is_configured 가 False 가 되어 제어 진입이 막힘 -- 값이 없는 것과
    # "제한 없음" 은 다름. 둥근 수를 넣어 두면 잰 값처럼 보여서 위험함.
    #
    # kp/kd 도 비워 둠. 한계를 모르는 관절에 게인만 넣으면 어디까지 가도 되는지
    # 모르는 채로 토크가 나감.
    motors:
      hipz:     {id: 1, model: RS02}
      hipx:     {id: 2, model: RS02}
      hipy:     {id: 3, model: RS02}
      knee:     {id: 4, model: RS02}
      ankle_a1: {id: 5, model: RS00}
      ankle_a2: {id: 6, model: RS00}
